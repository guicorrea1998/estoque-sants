<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle de Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f0efec;
  --text:#16161a; --muted:#6f6f78; --line:#e3e2de;
  --accent:#1f4fd8; --accent-soft:#e8edfd;
  --ok:#0e7a52; --ok-soft:#e0f3ea;
  --warn:#9a6300; --warn-soft:#fdf0d9;
  --dang:#b3261e; --dang-soft:#fbe6e4;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1b1b1f; --surface-2:#242429;
    --text:#f2f2f4; --muted:#9b9ba5; --line:#2e2e35;
    --accent:#7d9bff; --accent-soft:#1e2742;
    --ok:#4ecb96; --ok-soft:#13302a;
    --warn:#f0b34d; --warn-soft:#332713;
    --dang:#ff8a80; --dang-soft:#3a1f1e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1b1b1f; --surface-2:#242429;
  --text:#f2f2f4; --muted:#9b9ba5; --line:#2e2e35;
  --accent:#7d9bff; --accent-soft:#1e2742;
  --ok:#4ecb96; --ok-soft:#13302a;
  --warn:#f0b34d; --warn-soft:#332713;
  --dang:#ff8a80; --dang-soft:#3a1f1e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}

/* ── Topo ─────────────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line);
}
.top h1{font-size:21px}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.wrap{padding:16px 18px 8px;max-width:640px;margin:0 auto}

/* ── Cartões ──────────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--shadow);
}
.card.tap,.stat.tap{cursor:pointer;transition:transform .12s}
.card.tap:active,.stat.tap:active{transform:scale(.985)}

.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nome{font-weight:700;font-size:16px;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.val{font-weight:700;font-size:16px;white-space:nowrap}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:99px;letter-spacing:.02em;text-transform:uppercase;
}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-dang{background:var(--dang-soft);color:var(--dang)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

/* ── Painel ───────────────────────────────────────── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:800;margin-top:5px;letter-spacing:-.03em}
.stat .v.sm{font-size:18px}

/* ── Campos ───────────────────────────────────────── */
label{display:block;font-size:12px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
input,select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);color:var(--text);font-size:16px;font-family:inherit;
}
textarea{resize:vertical;min-height:78px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.fld{margin-bottom:13px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── Botões ───────────────────────────────────────── */
button{font-family:inherit;cursor:pointer;border:none}
.btn{
  width:100%;padding:14px;border-radius:var(--r-sm);font-size:15px;font-weight:700;
  background:var(--accent);color:#fff;letter-spacing:-.01em;
}
.btn:active{opacity:.85}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn.dang{background:var(--dang-soft);color:var(--dang)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.btn-linha{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px}

.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;padding:12px 8px;background:var(--surface);color:var(--muted);font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}

/* ── Busca ────────────────────────────────────────── */
.busca{position:relative;margin-bottom:13px}
.busca input{padding-left:38px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}

/* ── Navegação ────────────────────────────────────── */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;background:none;padding:10px 4px 9px;color:var(--muted);
  font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;letter-spacing:.01em;
}
.nav button.on{color:var(--accent)}
.nav .dot{
  position:absolute;top:6px;right:50%;margin-right:-20px;min-width:17px;height:17px;
  background:var(--dang);color:#fff;border-radius:99px;font-size:10px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ── Telas / modal ────────────────────────────────── */
.tela{display:none}
.tela.on{display:block}
.modal{
  position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.modal.on{display:block}
.modal-top{
  position:sticky;top:0;background:var(--bg);z-index:5;
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
}
.modal-top h2{font-size:18px;flex:1}
.x{background:var(--surface-2);border-radius:99px;width:34px;height:34px;font-size:19px;
  color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.vazio{text-align:center;padding:52px 22px;color:var(--muted)}
.vazio .em{font-size:40px;margin-bottom:12px;opacity:.5}
.vazio p{margin:0;font-size:14px;line-height:1.6}

.anuncio{
  background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-sm);
  padding:13px;font-size:14px;white-space:pre-wrap;line-height:1.6;margin-bottom:10px;
}
.sec-tit{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;margin:20px 0 9px}
.parc{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.parc:last-child{border-bottom:none}
.mini{padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;
  background:var(--surface-2);color:var(--text);border:1px solid var(--line);white-space:nowrap}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);
  padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:11px}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:8px}
.fitem{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.fitem img{width:100%;height:100%;object-fit:cover;display:block}
.fitem .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:99px;
  background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.fitem .pg{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.fadd{aspect-ratio:1;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:11px;font-weight:600}
.galeria{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.galeria img{height:190px;border-radius:var(--r-sm);border:1px solid var(--line);flex-shrink:0}
.carregando{text-align:center;padding:40px;color:var(--muted);font-size:14px}

.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.login-box{width:100%;max-width:360px}
.marca{text-align:center;margin-bottom:26px}
.marca .logo{font-size:44px;margin-bottom:8px}
.marca h1{font-size:23px;font-weight:800;letter-spacing:-.03em}
.marca p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.erro{color:var(--dang);font-size:13px;margin-bottom:11px;line-height:1.45;min-height:0}
.erro:empty{display:none}
.aviso-cfg{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);
  padding:13px;font-size:12.5px;line-height:1.55;margin-bottom:16px}
.aviso-cfg code{background:rgba(0,0,0,.08);padding:1px 4px;border-radius:4px;font-size:11.5px}
.sair{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;
  padding:6px 10px;cursor:pointer}

/* ── Documento ────────────────────────────────────── */
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:20px 17px;font-size:11.5px;line-height:1.6;margin-bottom:14px}
.doc .cab{text-align:center;border-bottom:1px solid #ddd;padding-bottom:11px;margin-bottom:13px}
.doc .cab .emp{font-size:11px;font-weight:800;letter-spacing:.04em;color:#333}
.doc .cab .cnpj{font-size:9.5px;color:#777;margin-top:1px}
.doc h3{font-size:12.5px;margin:9px 0 3px;color:#111;line-height:1.35;font-weight:700}
.doc .numdoc{font-size:9.5px;color:#777}
.doc .t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  color:#444;margin:15px 0 6px;padding-bottom:3px;border-bottom:1px solid #eee}
.doc p{margin:0 0 7px;text-align:justify}
.doc ul{margin:0 0 7px;padding-left:16px}
.doc li{margin-bottom:2px}
.dd div{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;border-bottom:1px dotted #eee}
.dd span{color:#777;flex-shrink:0}
.dd b{text-align:right;word-break:break-word}
.crono{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:5px}
.crono th{background:#f4f4f2;padding:5px 4px;text-align:left;font-size:9.5px;
  text-transform:uppercase;letter-spacing:.03em;color:#555;border:1px solid #e5e5e3}
.crono td{padding:5px 4px;border:1px solid #eee}
.ass-doc{display:flex;gap:16px;margin-top:18px}
.ass-doc>div{flex:1;text-align:center;font-size:9.5px;color:#555}
.ass-doc .ln{border-top:1px solid #333;padding-top:4px}
.ass-doc .sp{height:46px;display:flex;align-items:flex-end;justify-content:center}
.ass-doc img{max-height:46px}

/* ── Assinatura ───────────────────────────────────── */
.padwrap{border:2px dashed var(--line);border-radius:var(--r-sm);background:#fff;
  position:relative;margin-bottom:9px;touch-action:none}
.padwrap canvas{display:block;width:100%;height:165px;border-radius:var(--r-sm)}
.padwrap .dica{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#bbb;font-size:13px;pointer-events:none}
.padwrap.usado .dica{display:none}

/* ── Impressão: só o documento ────────────────────── */
@media print{
  body{background:#fff;padding:0}
  .top,.nav,.no-print,.modal-top,.sec-tit,.padwrap,.btn-linha,.btn{display:none!important}
  .modal{position:static;background:#fff;overflow:visible}
  .wrap{padding:0;max-width:none}
  .doc{border:none;border-radius:0;padding:0;font-size:10.5px;margin:0}
  .doc .t{break-after:avoid}
  .ass-doc{break-inside:avoid}
  .crono{break-inside:avoid}
}
</style>

<body>

<div id="login" class="login">
  <div class="login-box">
    <div class="marca">
      <div class="logo">📱</div>
      <h1>Controle de Estoque</h1>
      <p>Celulares e eletrônicos</p>
    </div>
    <div id="cfg-alerta"></div>
    <div id="form-login">
      <div class="fld"><label>E-mail</label>
        <input type="email" id="l-email" autocomplete="username" placeholder="seu@email.com"></div>
      <div class="fld"><label>Senha</label>
        <input type="password" id="l-senha" autocomplete="current-password" placeholder="mínimo 6 caracteres"
          onkeydown="if(event.key==='Enter')entrar()"></div>
      <div id="l-erro" class="erro"></div>
      <button class="btn" onclick="entrar()" id="btn-entrar">Entrar</button>
      <div class="btn-linha" style="margin-top:9px">
        <button class="btn sec" onclick="criarConta()">Criar conta</button>
        <button class="btn sec" onclick="recuperar()">Esqueci a senha</button>
      </div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="carregando">Carregando…</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc, runTransaction }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword,
         createUserWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

/* ═══════════════════════════════════════════════════
   Configuração
   ═══════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDi-0Tgsaf1asUh4l_AR_tvmd0K7MzbiGo",
  authDomain: "sistema-importadora-sants.firebaseapp.com",
  projectId: "sistema-importadora-sants",
  storageBucket: "sistema-importadora-sants.firebasestorage.app",
  messagingSenderId: "1086946771448",
  appId: "1:1086946771448:web:1843d2faa89d75c39ad60d"
};

// Cloudinary — o preset precisa ser do tipo "unsigned"
const CLOUD_NAME    = "esing0no";
const UPLOAD_PRESET = "esing0no";

const fbApp = initializeApp(firebaseConfig);
const fs = getFirestore(fbApp);
const auth = getAuth(fbApp);

// Cada vendedor só enxerga os próprios dados: tudo fica pendurado no uid.
let UID = null;
const colProdutos = () => collection(fs, 'usuarios', UID, 'produtos');
const docProduto  = id => doc(fs, 'usuarios', UID, 'produtos', id);
const docConfig   = () => doc(fs, 'usuarios', UID);

// Preenchido pelo próprio vendedor em Ajustes; entra nos documentos.
let EMPRESA = { nome:'', cnpj:'', resp:'', respCpf:'', end:'', cidade:'' };

/* ═══════════════════════════════════════════════════
   Estado
   ═══════════════════════════════════════════════════ */
let aparelhos = [];     // {id, nome, cat, custo, pedido, imei, descricao, fotos[], status, criadoEm, venda}
let nomesSalvos = [];
let telaAtual = 'painel';
let editandoId = null;
let online = true;

const hoje = () => new Date().toISOString().slice(0,10);
const money = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n=parseFloat(String(v).replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);

function dataBR(iso){
  if(!iso) return '—';
  const [a,m,d] = iso.split('-');
  return `${d}/${m}/${a}`;
}
function diasAte(iso){
  const alvo = new Date(iso+'T12:00:00');
  const ag = new Date(hoje()+'T12:00:00');
  return Math.round((alvo-ag)/86400000);
}
function somaMes(iso, n){
  const d = new Date(iso+'T12:00:00');
  const diaOrig = d.getDate();
  d.setMonth(d.getMonth()+n);
  if(d.getDate() < diaOrig) d.setDate(0);
  return d.toISOString().slice(0,10);
}
function somaDias(iso, n){
  const d = new Date(iso+'T12:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

/* ═══════════════════════════════════════════════════
   Firestore
   ═══════════════════════════════════════════════════ */
function iniciarDb(){
  onSnapshot(colProdutos(),
    snap => {
      online = true;
      aparelhos = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      aparelhos.sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));
      nomesSalvos = [...new Set(aparelhos.map(a => a.nome).filter(Boolean))].sort();
      render();
    },
    err => { console.warn('firestore:', err.code); online = false; render(); }
  );
}

async function salvarAparelho(obj, id){
  const chave = id || uid();
  try {
    await setDoc(docProduto(chave), obj);
    return chave;
  } catch(e){
    console.error(e);
    alert('Não foi possível salvar. Verifique a conexão e tente de novo.');
    return null;
  }
}
async function apagarAparelho(id){
  try { await deleteDoc(docProduto(id)); }
  catch(e){ alert('Não foi possível apagar.'); }
}

/* ═══════════════════════════════════════════════════
   Cloudinary — guarda a original e gera miniatura leve
   ═══════════════════════════════════════════════════ */
function cloudinaryConfigurado(){
  return CLOUD_NAME !== 'SEU_CLOUD_NAME' && UPLOAD_PRESET !== 'SEU_UPLOAD_PRESET';
}

function enviarFoto(file, aoProgredir){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`);
    xhr.upload.onprogress = e => {
      if(e.lengthComputable && aoProgredir) aoProgredir(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = () => {
      if(xhr.status < 200 || xhr.status >= 300) return reject(new Error('Upload falhou'));
      const r = JSON.parse(xhr.responseText);
      // A original fica intacta para o anúncio; a miniatura só para a lista.
      resolve({
        url: r.secure_url,
        thumb: r.secure_url.replace('/upload/', '/upload/w_400,h_400,c_fill,q_auto,f_auto/')
      });
    };
    xhr.onerror = () => reject(new Error('Sem conexão'));
    xhr.send(fd);
  });
}

/* ═══════════════════════════════════════════════════
   Cálculos
   ═══════════════════════════════════════════════════ */
// Numa venda com troca, o cliente paga em dinheiro o total menos o
// valor do aparelho dado na troca. Esse aparelho vira estoque à parte.
function emDinheiro(v){ return (v.valor||0) - (v.troca?.valor||0); }

function recebidoDe(ap){
  const v = ap.venda; if(!v) return 0;
  if(v.forma === 'vista') return emDinheiro(v);
  return (v.parcelas||[]).filter(p => p.pago).reduce((s,p) => s+p.valor, 0);
}
function aReceberDe(ap){
  const v = ap.venda; if(!v || v.forma === 'vista') return 0;
  return (v.parcelas||[]).filter(p => !p.pago).reduce((s,p) => s+p.valor, 0);
}
function parcelasAbertas(){
  const lista = [];
  aparelhos.filter(a => a.status === 'vendido' && a.venda?.forma === 'prazo')
    .forEach(a => (a.venda.parcelas||[]).forEach((p,i) => {
      if(!p.pago) lista.push({ ap:a, p, i, dias:diasAte(p.venc) });
    }));
  return lista.sort((a,b) => a.p.venc.localeCompare(b.p.venc));
}
function alertasCobranca(){
  return parcelasAbertas().filter(x => x.dias <= 3).length;
}
// Devedor é a pessoa, não a parcela: alguém com 4 parcelas abertas conta uma vez.
function devedores(){
  const m = new Map();
  parcelasAbertas().forEach(x => {
    const nome = x.ap.venda.cliente?.nome || 'Sem nome';
    const at = m.get(nome) || { nome, total:0, atraso:0, prox:x.p.venc };
    at.total += x.p.valor;
    if(x.dias < 0) at.atraso++;
    if(x.p.venc < at.prox) at.prox = x.p.venc;
    m.set(nome, at);
  });
  return [...m.values()].sort((a,b) => b.atraso - a.atraso || a.prox.localeCompare(b.prox));
}

// Numeração sequencial. Transação evita dois documentos com o mesmo número.
async function proximoNumero(){
  const ref = doc(fs, 'usuarios', UID, 'meta', 'contador');
  const ano = new Date().getFullYear();
  try {
    return await runTransaction(fs, async tx => {
      const snap = await tx.get(ref);
      const d = snap.exists() ? snap.data() : { ano, seq: 0 };
      const seq = (d.ano === ano ? d.seq : 0) + 1;
      tx.set(ref, { ano, seq });
      return `${ano}-${String(seq).padStart(4, '0')}`;
    });
  } catch(e){
    console.warn('contador:', e);
    return `${ano}-${Date.now().toString().slice(-4)}`;
  }
}

/* ── Assinatura ──────────────────────────────────── */
let ctxPad, desenhando = false, temTraco = false;
window.prepararPad = function(){
  const cv = document.getElementById('pad');
  if(!cv) return;
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  ctxPad = cv.getContext('2d');
  ctxPad.scale(dpr,dpr);
  ctxPad.lineWidth = 2.2; ctxPad.lineCap='round'; ctxPad.lineJoin='round';
  ctxPad.strokeStyle = '#1a2b6b';
  temTraco = false;
  document.getElementById('padwrap').classList.remove('usado');
  document.getElementById('btn-ass').disabled = true;
  const pos = e => { const b = cv.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x:t.clientX-b.left, y:t.clientY-b.top }; };
  const ini = e => { e.preventDefault(); desenhando=true;
    const p=pos(e); ctxPad.beginPath(); ctxPad.moveTo(p.x,p.y); };
  const mov = e => { if(!desenhando) return; e.preventDefault();
    const p=pos(e); ctxPad.lineTo(p.x,p.y); ctxPad.stroke();
    if(!temTraco){ temTraco=true;
      document.getElementById('padwrap').classList.add('usado');
      document.getElementById('btn-ass').disabled=false; } };
  const fim = () => { desenhando=false; };
  cv.onmousedown=ini; cv.onmousemove=mov; cv.onmouseup=fim; cv.onmouseleave=fim;
  cv.ontouchstart=ini; cv.ontouchmove=mov; cv.ontouchend=fim;
};

let fotosForm = [];   // {url, thumb} ou {pend:true, pct}

function renderFotos(){
  const g = document.getElementById('grade-fotos');
  if(!g) return;
  g.innerHTML = fotosForm.map((f,i) => f.pend
    ? `<div class="fitem"><div class="pg">${f.pct||0}%</div></div>`
    : `<div class="fitem"><img src="${f.thumb}" loading="lazy">
         <button class="rm" onclick="tirarFoto(${i})">✕</button></div>`
  ).join('') +
  `<button class="fadd" onclick="document.getElementById('f-fotos').click()">
     <span style="font-size:19px">＋</span>Foto</button>`;
}
window.tirarFoto = i => { fotosForm.splice(i,1); renderFotos(); };

window.subirFotos = async ev => {
  const arquivos = [...ev.target.files];
  ev.target.value = '';
  if(!arquivos.length) return;
  if(!cloudinaryConfigurado()){
    document.getElementById('aviso-fotos').innerHTML =
      '<span style="color:var(--dang)">Fotos não configuradas: preencha CLOUD_NAME e UPLOAD_PRESET no index.html.</span>';
    return;
  }
  // Sobe em segundo plano: o botão de salvar continua liberado.
  for(const arq of arquivos){
    const idx = fotosForm.push({ pend:true, pct:0 }) - 1;
    renderFotos();
    try {
      const r = await enviarFoto(arq, p => { fotosForm[idx].pct = p; renderFotos(); });
      fotosForm[idx] = r;
    } catch(e){
      fotosForm.splice(idx,1);
      document.getElementById('aviso-fotos').innerHTML =
        '<span style="color:var(--dang)">Uma foto não subiu. Tente de novo.</span>';
    }
    renderFotos();
  }
};

window.gravarAparelho = async () => {
  const nome = document.getElementById('f-nome').value.trim();
  if(!nome){ alert('Informe o modelo.'); return; }
  const base = {
    nome,
    cat: document.getElementById('f-cat').value,
    custo: num(document.getElementById('f-custo').value),
    pedido: num(document.getElementById('f-pedido').value),
    imei: document.getElementById('f-imei').value.trim(),
    descricao: document.getElementById('f-desc').value.trim(),
    fotos: fotosForm.filter(f => !f.pend),
  };
  if(fotosForm.some(f => f.pend) && !confirm('Ainda há foto subindo. Salvar sem ela?')) return;
  if(editandoId){
    const at = aparelhos.find(x => x.id === editandoId);
    await salvarAparelho({ ...at, ...base }, editandoId);
  } else {
    await salvarAparelho({ ...base, status:'estoque', criadoEm:new Date().toISOString(), venda:null });
  }
  editandoId = null;
  fecharModal();
};

window.removerAparelho = async id => {
  if(!confirm('Excluir este produto? Não dá para desfazer.')) return;
  await apagarAparelho(id);
  fecharModal();
};

    </div>`);
};

function detalheVenda(a, v){
  const lucro = (v.valor||0) - (a.custo||0);
  return `
    <div class="sec-tit">Venda</div>
    <div class="card">
      <div class="row"><span class="meta">Valor</span><b>${money(v.valor)}</b></div>
      <div class="row" style="margin-top:7px"><span class="meta">Data</span><b>${dataBR(v.data)}</b></div>
      <div class="row" style="margin-top:7px"><span class="meta">Forma</span>
        <b>${v.forma === 'vista' ? 'À vista' : `${v.parcelas.length}x`}</b></div>
      ${v.troca?.valor ? `<div class="row" style="margin-top:7px">
        <span class="meta">Troca${v.troca.modelo ? ' ('+esc(v.troca.modelo)+')' : ''}</span>
        <b>${money(v.troca.valor)}</b></div>` : ''}
      <div class="row" style="margin-top:7px"><span class="meta">Lucro</span>
        <b style="color:${lucro>=0?'var(--ok)':'var(--dang)'}">${money(lucro)}</b></div>
    </div>
    ${v.cliente?.nome ? `
      <div class="sec-tit">Cliente</div>
      <div class="card">
        <div class="nome">${esc(v.cliente.nome)}</div>
        <div class="meta" style="margin-top:4px">
          ${esc(v.cliente.tel||'sem telefone')}${v.cliente.doc ? ' · '+esc(v.cliente.doc) : ''}</div>
      </div>` : ''}
    ${v.forma === 'prazo' ? `
      <div class="sec-tit">Parcelas</div>
      <div class="card">
        ${v.parcelas.map((p,i) => `
          <div class="parc">
            <div>
              <div style="font-weight:600">${p.n}ª · ${money(p.valor)}</div>
              <div class="meta">${dataBR(p.venc)}</div>
            </div>
            ${p.pago
              ? `<span class="pill p-ok">pago</span>`
              : `<button class="mini" onclick="marcarPago('${a.id}',${i})">Marcar pago</button>`}
          </div>`).join('')}
      </div>` : ''}
    <div class="sec-tit">Documento</div>
    <div class="card tap" onclick="abrirDocumento('${a.id}')">
      <div class="row">
        <div style="min-width:0">
          <div class="nome" style="font-size:14.5px">${v.forma==='vista'
            ? 'Declaração de Venda e Garantia'
            : 'Contrato com Confissão de Dívida'}</div>
          <div class="meta">${v.doc?.assinatura
            ? 'nº '+v.doc.num+' · assinado'
            : v.forma==='vista' ? 'garantia legal de 90 dias' : 'cronograma das parcelas'}</div>
        </div>
        <span class="pill ${v.doc?.assinatura?'p-ok':'p-warn'}">
          ${v.doc?.assinatura ? 'assinado' : 'pendente'}</span>
      </div>
    </div>
    <button class="btn sec" style="margin-top:12px" onclick="desfazerVenda('${a.id}')">
      Desfazer venda (volta ao estoque)</button>`;
}

/* ── Anúncio ──────────────────────────────────────── */
function textoAnuncio(a){
  const l = [a.nome];
  if(a.descricao) l.push('', a.descricao);
  if(a.pedido) l.push('', `Valor: ${money(a.pedido)}`);
  l.push('', 'Aceito cartão e parcelamento.', 'Chame no privado.');
  return l.join('\n');
}
window.verAnuncio = id => {
  const a = aparelhos.find(x => x.id === id);
  modal(`
    <div class="modal-top">
      <button class="x" onclick="abrirDetalhe('${id}')">✕</button>
      <h2>Anúncio</h2>
    </div>
    <div class="wrap">
      <div class="meta" style="margin-bottom:10px">Revise antes de publicar. Edite o aparelho para mudar o texto.</div>
      <div class="anuncio" id="txt-anuncio">${esc(textoAnuncio(a))}</div>
      <button class="btn" onclick="copiar(document.getElementById('txt-anuncio').textContent, this)">Copiar</button>
    </div>`);
};

/* ── Registrar venda ──────────────────────────────── */
window.abrirVenda = id => {
  const a = aparelhos.find(x => x.id === id);
  modal(`
    <div class="modal-top">
      <button class="x" onclick="abrirDetalhe('${id}')">✕</button>
      <h2>Registrar venda</h2>
    </div>
    <div class="wrap">
      <div class="meta" style="margin-bottom:13px">${esc(a.nome)} · custo ${money(a.custo)}</div>

      <div class="dupla">
        <div class="fld"><label>Valor da venda</label>
          <input id="v-valor" type="text" inputmode="decimal" placeholder="0,00"
            value="${a.pedido ? String(a.pedido).replace('.',',') : ''}" oninput="recalc()"></div>
        <div class="fld"><label>Data</label>
          <input id="v-data" type="date" value="${hoje()}"></div>
      </div>

      <div class="fld">
        <label>Pagamento</label>
        <div class="seg">
          <button id="b-vista" class="on" onclick="setForma('vista')">À vista</button>
          <button id="b-prazo" onclick="setForma('prazo')">A prazo</button>
        </div>
      </div>

      <div id="bloco-prazo" style="display:none">
        <div class="dupla">
          <div class="fld"><label>Parcelas</label>
            <input id="v-n" type="number" min="2" max="24" value="2" oninput="recalc()"></div>
          <div class="fld"><label>Intervalo</label>
            <select id="v-int" onchange="recalc()">
              <option value="mensal">Mensal</option>
              <option value="15">Quinzenal</option>
              <option value="7">Semanal</option>
            </select></div>
        </div>
        <div class="dupla">
          <div class="fld"><label>1º vencimento</label>
            <input id="v-venc" type="date" value="${somaMes(hoje(),1)}" oninput="recalc()"></div>
          <div class="fld"><label>Valor da parcela</label>
            <input id="v-vparc" type="text" inputmode="decimal" placeholder="0,00"></div>
        </div>
        <div class="meta" id="resumo-parc" style="margin:-4px 0 13px"></div>
      </div>

      <div class="sec-tit">Aparelho na troca</div>
      <div class="dupla">
        <div class="fld"><label>Modelo recebido</label>
          <input id="v-tmod" placeholder="Opcional"></div>
        <div class="fld"><label>Valor dado</label>
          <input id="v-tval" type="text" inputmode="decimal" placeholder="0,00" oninput="recalc()"></div>
      </div>
      <div class="d2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fld"><label>IMEI recebido</label>
          <input id="v-timei" inputmode="numeric" placeholder="Opcional"></div>
        <div class="fld"><label>Estado</label>
          <input id="v-test" placeholder="Ex: bom, com riscos"></div>
      </div>
      <div class="meta" style="margin:-4px 0 13px">Se preencher o valor, o aparelho entra no estoque com esse custo.</div>

      <div class="sec-tit">Cliente</div>
      <div class="fld"><label>Nome</label><input id="v-cnome" placeholder="Nome completo"></div>
      <div class="dupla">
        <div class="fld"><label>Telefone</label>
          <input id="v-ctel" inputmode="tel" placeholder="(00) 00000-0000"></div>
        <div class="fld"><label>CPF</label>
          <input id="v-cdoc" inputmode="numeric" placeholder="Opcional"></div>
      </div>

      <button class="btn" onclick="gravarVenda('${id}')">Confirmar venda</button>
    </div>`);
  recalc();
};

let formaSel = 'vista';
window.setForma = f => {
  formaSel = f;
  document.getElementById('b-vista').className = f === 'vista' ? 'on' : '';
  document.getElementById('b-prazo').className = f === 'prazo' ? 'on' : '';
  document.getElementById('bloco-prazo').style.display = f === 'prazo' ? 'block' : 'none';
  recalc();
};

window.recalc = () => {
  const bl = document.getElementById('bloco-prazo');
  if(!bl || formaSel !== 'prazo') return;
  const total = num(document.getElementById('v-valor').value) - num(document.getElementById('v-tval').value);
  const n = Math.max(2, parseInt(document.getElementById('v-n').value) || 2);
  const campo = document.getElementById('v-vparc');
  if(document.activeElement !== campo){
    campo.value = (total / n).toFixed(2).replace('.', ',');
  }
  document.getElementById('resumo-parc').textContent =
    `${n}x de ${money(total/n)} — total a prazo ${money(total)}`;
};

window.gravarVenda = async id => {
  const a = aparelhos.find(x => x.id === id);
  const valor = num(document.getElementById('v-valor').value);
  if(!valor){ alert('Informe o valor da venda.'); return; }

  const trocaVal = num(document.getElementById('v-tval').value);
  const trocaMod = document.getElementById('v-tmod').value.trim();
  if(trocaVal > valor){ alert('O valor da troca não pode ser maior que a venda.'); return; }

  const cliente = {
    nome: document.getElementById('v-cnome').value.trim(),
    tel:  document.getElementById('v-ctel').value.trim(),
    doc:  document.getElementById('v-cdoc').value.trim(),
  };
  if(formaSel === 'prazo' && !cliente.nome){
    alert('Venda a prazo precisa do nome do cliente para a cobrança.'); return;
  }

  const venda = {
    valor,
    data: document.getElementById('v-data').value || hoje(),
    forma: formaSel,
    cliente,
    troca: trocaVal ? {
      valor: trocaVal, modelo: trocaMod,
      imei: document.getElementById('v-timei').value.trim(),
      estado: document.getElementById('v-test').value.trim()
    } : null,
    parcelas: [],
  };

  if(formaSel === 'prazo'){
    const n = Math.max(2, parseInt(document.getElementById('v-n').value) || 2);
    const vp = num(document.getElementById('v-vparc').value) || ((valor - trocaVal) / n);
    const intv = document.getElementById('v-int').value;
    const base = document.getElementById('v-venc').value || somaMes(hoje(), 1);
    for(let i = 0; i < n; i++){
      venda.parcelas.push({
        n: i + 1,
        valor: Math.round(vp * 100) / 100,
        venc: intv === 'mensal' ? somaMes(base, i) : somaDias(base, parseInt(intv) * i),
        pago: false,
      });
    }
  }

  await salvarAparelho({ ...a, status:'vendido', venda }, id);

  // O aparelho recebido na troca entra no estoque como item novo.
  if(trocaVal){
    await salvarAparelho({
      nome: trocaMod || 'Aparelho recebido em troca',
      cat: 'Celular',
      custo: trocaVal, pedido: 0,
      imei: document.getElementById('v-timei').value.trim(),
      descricao: `Recebido na troca da venda de ${a.nome} em ${dataBR(venda.data)}.`,
      status: 'estoque', criadoEm: new Date().toISOString(), venda: null,
    });
  }
  fecharModal();
  telaAtual = 'vendas';
  render();
  if(confirm('Venda registrada. Gerar o documento para assinatura agora?')) abrirDocumento(id);
};

window.desfazerVenda = async id => {
  if(!confirm('Desfazer a venda e voltar o aparelho ao estoque?')) return;
  const a = aparelhos.find(x => x.id === id);
  await salvarAparelho({ ...a, status:'estoque', venda:null }, id);
  fecharModal();
};

window.marcarPago = async (id, i) => {
  const a = aparelhos.find(x => x.id === id);
  if(!a?.venda?.parcelas?.[i]) return;
  const parcelas = a.venda.parcelas.map((p, k) => k === i ? { ...p, pago:true } : p);
  await salvarAparelho({ ...a, venda:{ ...a.venda, parcelas } }, id);
  const m = document.getElementById('modal');
  if(m?.classList.contains('on')) abrirDetalhe(id);
};

/* ── Cobrança ─────────────────────────────────────── */
window.copiarCobranca = (id, i) => {
  const a = aparelhos.find(x => x.id === id);
  const p = a.venda.parcelas[i];
  const d = diasAte(p.venc);
  const nome = (a.venda.cliente?.nome || '').split(' ')[0] || 'Olá';
  const txt = d < 0
    ? `Oi, ${nome}! Tudo bem?\n\nPassando para lembrar da parcela ${p.n} do ${a.nome}, no valor de ${money(p.valor)}, que venceu em ${dataBR(p.venc)}.\n\nConsegue acertar hoje? Qualquer coisa me chama.`
    : `Oi, ${nome}! Tudo bem?\n\nLembrete da parcela ${p.n} do ${a.nome}, no valor de ${money(p.valor)}, com vencimento em ${dataBR(p.venc)}.\n\nQualquer dúvida é só chamar.`;
  copiar(txt);
};

async function copiar(txt, btn){
  try {
    await navigator.clipboard.writeText(txt);
  } catch(e){
    const t = document.createElement('textarea');
    t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch(_){}
    t.remove();
  }
  if(btn){
    const o = btn.textContent;
    btn.textContent = 'Copiado ✓';
    setTimeout(() => btn.textContent = o, 1600);
  } else {
    alert('Mensagem copiada. É só colar no WhatsApp.');
  }
}
window.copiar = copiar;

/* ═══════════════════════════════════════════════════ */
iniciarApp();
</script>
</body>
</html>
